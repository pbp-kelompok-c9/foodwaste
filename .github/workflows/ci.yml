name: Django CI

on:
  push:
    branches: [main]

permissions:
  contents: read

# Kalau kamu push lagi ke branch yang sama, run lama dibatalkan.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Pakai SQLite lokal dan SECRET_KEY bawaan (lihat foodwaste/settings.py).
      PRODUCTION: "False"

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt memakai mirror Aliyun khusus build PWS.
          # Di CI baris --index-url dibuang supaya memakai pypi.org.
          grep -v '^--index-url' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Django system check
        run: python manage.py check

      - name: Pastikan tidak ada migrasi yang belum dibuat
        run: python manage.py makemigrations --check --dry-run

      - name: Jalankan test
        run: python manage.py test --verbosity 2