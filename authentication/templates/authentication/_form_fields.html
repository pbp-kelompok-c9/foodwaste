{# Wadah error selalu dirender agar profile.js bisa mengisinya dari respons JSON. #}
<p class="tw-m-0 tw-mb-4 tw-rounded-xl tw-bg-red-100 tw-px-4 tw-py-3 tw-text-sm tw-text-red-800{% if not form.non_field_errors %} tw-hidden{% endif %}" role="alert" data-error-for="__all__">{{ form.non_field_errors|join:" " }}</p>
{% for field in form %}
<div class="tw-mb-4">
  <label for="{{ field.id_for_label }}" class="tw-mb-1 tw-block tw-text-sm tw-font-bold">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<p class="tw-m-0 tw-mt-1 tw-text-xs tw-text-accent">{{ field.help_text }}</p>{% endif %}
  <p class="tw-m-0 tw-mt-1 tw-text-sm tw-text-red-700{% if not field.errors %} tw-hidden{% endif %}" role="alert" data-error-for="{{ field.name }}">{{ field.errors|join:" " }}</p>
</div>
{% endfor %}
