{% if form.non_field_errors %}<div class="auth-alert" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
<div class="auth-field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="auth-input-wrap">{{ field }}{% if field.field.widget.input_type == 'password' %}<button class="password-toggle" type="button" data-password="{{ field.id_for_label }}" aria-controls="{{ field.id_for_label }}" aria-label="Tampilkan {{ field.label|lower }}" aria-pressed="false" hidden>Lihat</button>{% endif %}</div>
  {% if field.help_text %}<div class="auth-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {% if field.errors %}<div class="auth-error" id="{{ field.auto_id }}_error" role="alert">{{ field.errors }}</div>{% endif %}
</div>
{% endfor %}
