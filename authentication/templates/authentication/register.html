{% extends 'base.html' %}
{% block title %}Daftar - FoodWastey{% endblock %}
{% block content %}
<section>
  <h1>Daftar akun</h1>
  <form method="post" action="{% url 'authentication:register' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Daftar</button>
  </form>
  <p>Sudah punya akun? <a href="{% url 'authentication:login' %}">Masuk</a></p>
{% include 'authentication/google_button.html' %}
</section>
{% endblock %}
