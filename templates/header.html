
<header class="navbar">
    <a href="/" class="navbar__brand">FoodWastey</a>

    <nav class="navbar__menu" aria-label="Navigasi utama">

        <a href="{% url 'discovery_dashboard:discovery' %}"
           class="navbar__link {% if request.path == '/' or request.path == '/discovery/' %}is-active{% endif %}"
           {% if request.path == '/' or request.path == '/discovery/' %}aria-current="page"{% endif %}>
            Beranda
        </a>

        <a href="/reporting/"
           class="navbar__link {% if '/reporting' in request.path %}is-active{% endif %}"
           {% if '/reporting' in request.path %}aria-current="page"{% endif %}>
            Laporan
        </a>

        <a href="{% url 'event_management:main' %}"
           class="navbar__link {% if '/events/' in request.path %}is-active{% endif %}"
           {% if '/events/' in request.path %}aria-current="page"{% endif %}>
            Acara
        </a>

        {% if user.is_staff %}
        <a href="/management/"
           class="navbar__link {% if '/management' in request.path %}is-active{% endif %}"
           {% if '/management' in request.path %}aria-current="page"{% endif %}>
            Kelola
        </a>
        {% endif %}

        <a href="{% url 'discovery_dashboard:dashboard' %}"
           class="navbar__link {% if request.path == '/dashboard/' %}is-active{% endif %}"
           {% if request.path == '/dashboard/' %}aria-current="page"{% endif %}>
            Dashboard
        </a>

        <a href="#" class="navbar__icon-btn" aria-label="Notifikasi">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
            </svg>
        </a>

        {% if user.is_authenticated %}

        <details class="user">
            <summary>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-4.43-.82-6.14-2.88C7.55 15.8 9.68 15 12 15s4.45.8 6.14 2.12C16.43 19.18 14.03 20 12 20z"/>
                </svg>

                <span class="user__name">
                    {{ user.username }}
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7 10l5 5 5-5z"/>
                    </svg>
                </span>
            </summary>

            <div class="user__dropdown">
                <a href="{% url 'authentication:profile' %}">
                    Profil saya
                </a>

                <a href="{% url 'authentication:user_list' %}">
                    Direktori pengguna
                </a>

                <form method="post" action="{% url 'authentication:logout' %}">
                    {% csrf_token %}
                    <button type="submit">Keluar</button>
                </form>
            </div>
        </details>

        {% else %}

        <a href="{% url 'authentication:login' %}" class="navbar__link">
            Masuk
        </a>

        {% endif %}

    </nav>
</header>
